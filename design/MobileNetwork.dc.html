<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #FBF9F5;
      color: #1F1B16;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: #6E2B2B; text-decoration: none; }
    a:hover { color: #4A1C1C; }
    .serif { font-family: "Newsreader", Georgia, "Times New Roman", serif; font-weight: 400; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl {
      font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
      color: #A39A8C; font-weight: 500;
    }
    input, select, textarea, button { font: inherit; color: inherit; }
    ::selection { background: #E8DCD2; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; display: flex; flex-direction: column; background: #FBF9F5;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #E4DED2;">
    <span class="serif" style="font-size: 21px; letter-spacing: 0.015em;">Flaunt</span>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 7px; border: 1px solid #D3CABA; padding: 6px 10px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6E2B2B" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.2"></circle></svg>
        <span class="mono" style="font-size: 12.5px; font-weight: 500;">10</span>
      </div>
      <div class="serif" style="width: 34px; height: 34px; border-radius: 50%; background: #EDE3D6; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4A4137;">AM</div>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <h1 class="serif" style="margin: 0; font-size: 27px; font-weight: 400; letter-spacing: -0.01em;">Your network</h1>
      <span style="font-size: 12.5px; color: #6B6459;">7 direct &middot; 63 within reach</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #D3CABA; background: #FFFFFF; padding: 13px 13px; min-height: 46px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A39A8C" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><path d="M16.2 16.2 L21 21"></path></svg>
      <span style="font-size: 13.5px; color: #A39A8C;">Search people by name</span>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="padding-bottom: 9px; border-bottom: 1px solid #D3CABA;"><span class="lbl">Direct connections</span></div>
      <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 13px; padding: 14px 0; border-bottom: 1px solid #E4DED2; min-height: 62px;">
          <div class="serif" style="width: 40px; height: 40px; border-radius: 50%; background: #EFE7DC; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4A4137; flex-shrink: 0;">{{p.initials}}</div>
          <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
            <span class="serif" style="font-size: 16.5px;">{{p.name}}</span>
            <span style="font-size: 11.5px; color: #6B6459; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{p.role}}</span>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C3B9A8" stroke-width="1.8" style="flex-shrink: 0;"><path d="M10 6 L16 12 L10 18"></path></svg>
        </div>
      </sc-for>
    </div>

  </main>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      people: [
        { initials: 'PN', name: 'Priya Nair',      role: 'Design director · Ather Energy' },
        { initials: 'DO', name: 'Daniel Osei',     role: 'Infrastructure engineer · Paystack' },
        { initials: 'MK', name: 'Meera Krishnan',  role: 'Clinical research lead · Narayana Health' },
        { initials: 'TF', name: 'Tomás Ferreira',role: 'Founder · Lote 9' },
        { initials: 'SQ', name: 'Sana Qureshi',    role: 'Corporate counsel · Trilegal' },
        { initials: 'WT', name: 'Wei Lin Tan',     role: 'Quantitative researcher · GIC' },
        { initials: 'RD', name: 'Rahul Deshpande', role: 'Staff SRE · Razorpay' }
      ]
    };
  }
}
</script>
</body>
</html>
