/* Flaunt commits to one visual world - warm paper, letterpress rules. Single
   theme on purpose, so every color is painted explicitly and the page holds on
   whatever ground the host paints behind it. */
:root {

  --good:#2E5E3E; --good-wash:#EFF4F0; --good-line:#B9CBBE;
  --warn:#8A5A1E; --warn-wash:#F7F1E3; --warn-line:#D8C9A8;
  --bad:#9B2C2C;
  --bms-bg:#F2F4F6; --bms-panel:#FFFFFF; --bms-ink:#171A1F; --bms-soft:#3C4653;
  --bms-mute:#6B7684; --bms-rule:#DDE1E6; --bms-rule-2:#C9D0D8; --bms-accent:#2B4A6E;
  --bms-accent-wash:#EDF2F8; --bms-head:#F7F9FA;
  --bms-good:#1F6B43; --bms-good-wash:#E8F3EC; --bms-good-line:#BFDCCB;
  --bms-bad:#A32020; --bms-bad-wash:#FBEBEB; --bms-bad-line:#E8C4C4;

  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin:0; background:var(--paper); color:var(--ink);

}
a { color:var(--accent); text-decoration:none; }
a:hover { color:var(--accent-deep); }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

.serif { font-family:var(--serif); font-weight:400; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.lbl { font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--faint); font-weight:500; }

/* ---- app chrome ---- */
.top {

  font-size:14px; width:100%; outline:none; font-family:var(--sans); }
.field:focus { border-color:var(--accent); }
.scrim { position:fixed; inset:0; background:rgba(31,27,22,.38); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { width:min(540px,100%); background:var(--paper); border:1px solid #C6BBA8;

/* ---- BMS ---- */
.bms { background:var(--bms-bg); color:var(--bms-ink); font-size:13px; min-height:100vh; }

.bms-nav button { background:none; border:none; text-align:left; padding:9px 16px;

.bms-main { flex-grow:1; padding:22px 24px 48px; display:flex; flex-direction:column; gap:18px; min-width:0; }
.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px;

.stats > div { background:var(--bms-panel); padding:13px 16px; display:flex; flex-direction:column; gap:3px; }

table { border-collapse:collapse; width:100%; min-width:940px; }
thead th { background:var(--bms-head); border-bottom:1px solid var(--bms-rule); padding:10px 16px;

tbody td { border-bottom:1px solid #EDF0F2; padding:9px 16px; vertical-align:middle; }
.step { width:24px; height:24px; border:1px solid var(--bms-rule-2); background:var(--bms-panel);

.step:hover { background:var(--bms-accent-wash); border-color:var(--bms-accent); color:var(--bms-accent); }
.pill { border:1px solid var(--bms-rule-2); background:var(--bms-panel); padding:6px 12px; font-size:12px; color:var(--bms-soft); }
.pill[aria-current="true"] { border-color:var(--bms-accent); background:var(--bms-accent-wash);

    const n = id==='all' ? S.invites.length : S.invites.filter((r)=>r.status===id).length;

    return `<button onclick="S.invFilter='${id}';render();" aria-current="${on}"

  }).join('');
  const shown = S.invites.filter((r)=>S.invFilter==='all'||r.status===S.invFilter);
  const refunded = S.invites.filter((r)=>r.tokenOutcome.indexOf('returned')>-1).length;

  const tone = (st) => st==='ACCEPTED' ? {bd:'#CFC6B6',bg:'#F4F0E8',fg:'#6B6459'}
    : (st==='REJECTED'||st==='EXPIRED'||st==='GATEKEEPER_DENIED')
      ? {bd:'var(--good-line)',bg:'var(--good-wash)',fg:'var(--good)'}
      : {bd:'var(--warn-line)',bg:'var(--warn-wash)',fg:'var(--warn)'};

  const rows = shown.map((r) => {
    const t = tone(r.status);
    const back = r.tokenOutcome.indexOf('returned') > -1;
    return `<div style="display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap;">
      <div style="display:flex;flex-direction:column;gap:2px;width:min(300px,100%);flex-shrink:0;">

      </div>
      <div style="width:132px;flex-shrink:0;">
        <span class="chip" style="border-color:${t.bd};background:${t.bg};"><span class="dot" style="background:${t.fg};"></span><span class="lbl" style="color:${t.fg};">${esc(r.status)}</span></span>
      </div>
      <div style="flex-grow:1;min-width:120px;font-size:12.5px;color:var(--ink-2);">
        ${r.daysLeft !== null && r.daysLeft !== undefined ? esc(r.daysLeft + ' day' + (r.daysLeft===1?'':'s') + ' left') : ''}

      <div style="display:flex;align-items:center;gap:7px;width:150px;flex-shrink:0;justify-content:flex-end;">
        ${back?`<span style="color:var(--good);display:flex;">${RETURN}</span>`:''}
        <span style="font-size:12.5px;color:${back?'var(--good)':'var(--ink-soft)'};font-weight:${back?500:400};">${esc(r.tokenOutcome)}</span>
      </div>
    </div>`;
  }).join('');

  return topbar('invitations') + `<div class="wrap"><div class="col wide" style="gap:26px;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;">

    ${S.invites.length ? `<div style="display:flex;gap:24px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap;">${tabs}</div>
    <div style="display:flex;flex-direction:column;">${rows || `<p style="margin:24px 0;font-size:13.5px;color:var(--faint);">Nothing in this state.</p>`}</div>`

  </div></div>`;
}

/**
 * AppSync call carrying the Cognito id token. Errors come back in a 200 body,
 * so the GraphQL errors array is checked before the payload is trusted.
 */
async function gql(query, variables) {
  const s = session();
  if (!s || !s.idToken) throw new Error('Your session has expired. Sign in again.');
  if (!API_READY) throw new Error('This build has no API endpoint configured.');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: s.idToken },
    body: JSON.stringify({ query, variables: variables || {} })
  });
  const body = await res.json().catch(() => ({}));
  if (body.errors && body.errors.length) throw new Error(body.errors[0].message || 'Request failed');
  if (!res.ok) throw new Error('Request failed (' + res.status + ')');
  return body.data;
}

/**
 * A long-open tab keeps running the release it loaded. version.json is served
 * uncached, so comparing it to this build's id is how the tab learns it is
 * behind — then it offers a refresh rather than reloading under the user.
 */
function watchForNewVersion() {
  if (!BUILD_ID || BUILD_ID.indexOf('__') === 0) return;
  setInterval(async () => {
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = await r.json();
      if (v && v.build && v.build !== BUILD_ID && !S.newVersion) { S.newVersion = true; render(); }
    } catch (e) { /* offline or transient — try again next tick */ }
  }, 90000);
}

/* ---------- BMS sign-in: passwordless email OTP (Cognito CUSTOM_AUTH) ---------- */
const IDP = () => `https://cognito-idp.${AUTH.region}.amazonaws.com/`;
async function idp(target, body) {
  const res = await fetch(IDP(), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-amz-json-1.1',
      'X-Amz-Target': `AWSCognitoIdentityProviderService.${target}`
    },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { /* non-JSON error body */ }
  if (!res.ok) {
    const type = String(data.__type || '').split('#').pop();
    throw Object.assign(new Error(data.message || type || 'Sign-in failed'), { type });
  }
  return data;
}
function session() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
}
function signedIn() {
  const s = session();
  return !!(s && s.idToken && s.expiresAt > Date.now());
}
function signOut() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  S.auth = { step: APP === 'portal' ? 'choose' : 'email', email: APP === 'bms' ? 'riyad@mobil80.com' : '', busy: false, error: null, session: null };
  render();
}
async function sendCode() {
  const el = document.getElementById('auth-email');
  const email = (el ? el.value : '').trim().toLowerCase();
  if (!email) { S.auth.error = 'Enter your email address.'; render(); return; }
  S.auth.busy = true; S.auth.error = null; S.auth.email = email; render();
  try {
    const r = await idp('InitiateAuth', {
      AuthFlow: 'CUSTOM_AUTH', ClientId: AUTH.clientId, AuthParameters: { USERNAME: email }
    });
    S.auth.session = r.Session; S.auth.step = 'code';
  } catch (e) {
    // preventUserExistenceErrors is on, so an unknown address fails here the
    // same way a known one would. Say the neutral thing rather than confirming
    // whether the account exists.
    S.auth.error = e.type === 'NotAuthorizedException'
      ? 'That address cannot sign in to this console.'
      : (e.message || 'Could not send the code. Try again.');
  } finally { S.auth.busy = false; render(); }
}
async function verifyCode() {
  const el = document.getElementById('auth-code');
  const code = (el ? el.value : '').trim();
  if (code.length !== 6) { S.auth.error = 'Enter the six-digit code.'; render(); return; }
  S.auth.busy = true; S.auth.error = null; render();
  try {
    const r = await idp('RespondToAuthChallenge', {
      ChallengeName: 'CUSTOM_CHALLENGE', ClientId: AUTH.clientId, Session: S.auth.session,
      ChallengeResponses: { USERNAME: S.auth.email, ANSWER: code }
    });
    if (r.AuthenticationResult && r.AuthenticationResult.IdToken) {
      const a = r.AuthenticationResult;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        idToken: a.IdToken, email: S.auth.email,
        expiresAt: Date.now() + (a.ExpiresIn || 3600) * 1000
      }));
      S.auth.step = 'email'; S.auth.session = null;
    } else {
      // Cognito re-challenged: the code was wrong and rounds remain.
      S.auth.session = r.Session;
      S.auth.error = 'That code was not right. Try again.';
    }
  } catch (e) {
    S.auth.error = e.type === 'NotAuthorizedException'
      ? 'That code has expired or been used. Request a new one.'
      : (e.message || 'Could not verify the code.');
    if (e.type === 'NotAuthorizedException') { S.auth.step = 'email'; S.auth.session = null; }
  } finally { S.auth.busy = false; render(); }
}


/**
 * A password is required by the SignUp API but never used: the pool's client
 * enables only CUSTOM_AUTH, so there is no flow that could present it. It is
 * generated, sent once, and forgotten.
 */
function throwawayPassword() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/[^A-Za-z0-9]/g, '') + 'aA1!';
}
async function signUp() {
  const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const email = val('su-email').toLowerCase();
  const name = val('su-name');
  const designation = val('su-designation');
  const country = val('su-country');
  if (!email || !name || !designation) {
    S.auth.error = 'Email, full name and designation are required.'; render(); return;
  }
  S.auth.busy = true; S.auth.error = null; S.auth.email = email; render();
  const attrs = [
    { Name: 'email', Value: email },
    { Name: 'name', Value: name },
    { Name: 'custom:country', Value: country || 'IN' },
    { Name: 'custom:designation', Value: designation }
  ];
  const org = val('su-org'), loc = val('su-location'), bio = val('su-bio');
  if (org) attrs.push({ Name: 'custom:organisation', Value: org });
  if (loc) attrs.push({ Name: 'custom:location', Value: loc });
  if (bio) attrs.push({ Name: 'custom:bio', Value: bio });
  try {
    await idp('SignUp', {
      ClientId: AUTH.clientId, Username: email,
      Password: throwawayPassword(), UserAttributes: attrs
    });
  } catch (e) {
    if (e.type !== 'UsernameExistsException') {
      S.auth.busy = false;
      S.auth.error = e.message || 'Could not create the account.';
      render(); return;
    }
    // Already registered — fall through to sign-in rather than dead-ending.
  }
  try {
    const r = await idp('InitiateAuth', {
      AuthFlow: 'CUSTOM_AUTH', ClientId: AUTH.clientId, AuthParameters: { USERNAME: email }
    });
    S.auth.session = r.Session; S.auth.step = 'code';
  } catch (e) {
    S.auth.error = e.message || 'Account created, but the code could not be sent.';
  } finally { S.auth.busy = false; render(); }
}

      ${notConfigured ? `<div style="border:1px solid var(--bms-warn-line);background:var(--bms-warn-wash);padding:12px 14px;font-size:12.5px;color:var(--bms-warn);">Sign-in is not configured in this build. Deploy the BMS auth stack, then rebuild.</div>` : ''}
      ${a.error ? `<div role="alert" style="border:1px solid var(--bms-bad-line);background:var(--bms-bad-wash);padding:11px 13px;font-size:12.5px;color:var(--bms-bad);">${esc(a.error)}</div>` : ''}

        </div>
        <button ${disabled} onclick="sendCode()" style="background:var(--bms-accent);color:#fff;border:none;padding:12px 18px;font-size:13.5px;font-weight:600;">
          ${a.busy ? 'Sending…' : 'Email me a code'}</button>

        <div style="display:flex;flex-direction:column;gap:7px;">

          <input id="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" ${disabled}
            style="border:1px solid var(--bms-rule-2);padding:11px 12px;font-size:20px;letter-spacing:.34em;width:100%;outline:none;font-family:var(--mono);">
          <span style="font-size:11.5px;color:var(--bms-mute);">Sent to ${esc(a.email)}. It expires in 5 minutes.</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <button ${disabled} onclick="verifyCode()" style="background:var(--bms-accent);color:#fff;border:none;padding:12px 18px;font-size:13.5px;font-weight:600;flex-grow:1;">
            ${a.busy ? 'Checking…' : 'Sign in'}</button>
          <button ${disabled} onclick="S.auth.step='email';S.auth.error=null;render();"
            style="background:none;border:none;font-size:12.5px;color:var(--bms-mute);">Start over</button>
        </div>
      `}
    </div>
  </div>`;
}


function vPortalAuth() {
  const a = S.auth;
  const d = a.busy ? 'disabled' : '';
  const shell = (inner) => `<div class="wrap" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <div style="width:min(520px,100%);display:flex;flex-direction:column;gap:26px;">
      <div style="display:flex;flex-direction:column;gap:7px;">
        <span class="serif" style="font-size:24px;letter-spacing:.015em;">Flaunt</span>
      </div>
      ${!AUTH_READY ? `<div style="border:1px solid var(--warn-line);background:var(--warn-wash);padding:12px 14px;font-size:12.5px;color:var(--warn);">Sign-in is not configured in this build.</div>` : ''}
      ${a.error ? `<div role="alert" style="border:1px solid #E0C3C3;background:#FBF0F0;padding:11px 13px;font-size:12.5px;color:var(--bad);">${esc(a.error)}</div>` : ''}
      ${inner}
    </div></div>`;

  if (a.step === 'code') {
    return shell(`
      <div style="display:flex;flex-direction:column;gap:7px;">
        <h1 class="big">Check your email</h1>
        <p style="margin:0;font-size:14px;color:var(--ink-soft);">We sent a six-digit code to ${esc(a.email)}. It expires in five minutes.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="auth-code">Code</label>
        <input class="field mono" id="auth-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" ${d}
          style="font-size:22px;letter-spacing:.36em;">
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="btn" ${d} onclick="verifyCode()">${a.busy ? 'Checking…' : 'Continue'}</button>
        <button ${d} onclick="S.auth.step=(APP==='portal'?'choose':'email');S.auth.error=null;render();"
          style="background:none;border:none;font-size:13px;color:var(--ink-soft);">Start over</button>
      </div>`);
  }

  if (a.step === 'signin') {
    return shell(`
      <div style="display:flex;flex-direction:column;gap:7px;">
        <h1 class="big">Sign in</h1>
        <p style="margin:0;font-size:14px;color:var(--ink-soft);">No password. We email you a code.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="auth-email">Email</label>
        <input class="field mono" id="auth-email" type="email" value="${esc(a.email)}" ${d} style="font-size:13.5px;">
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="btn" ${d} onclick="sendCode()">${a.busy ? 'Sending…' : 'Email me a code'}</button>
        <button ${d} onclick="S.auth.step='signup';S.auth.error=null;render();"
          style="background:none;border:none;font-size:13px;color:var(--accent);">Create an account</button>
      </div>`);
  }

  if (a.step === 'signup') {
    return shell(`
      <div style="display:flex;flex-direction:column;gap:7px;">
        <h1 class="big">Create your account</h1>
        <p style="margin:0;font-size:14px;color:var(--ink-soft);">Eight fields, once. Flaunt keeps nothing else about you.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-email">Email</label>
        <input class="field mono" id="su-email" type="email" ${d} style="font-size:13.5px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-name">Full name</label>
        <input class="field" id="su-name" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-designation">Designation</label><span class="lbl" style="color:var(--warn);">Required</span></div>
        <input class="field" id="su-designation" maxlength="100" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-org">Organisation</label><span class="lbl">Optional</span></div>
        <input class="field" id="su-org" maxlength="100" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-location">Location</label><span class="lbl">Optional</span></div>
        <input class="field" id="su-location" maxlength="80" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-country">Country</label>
        <select class="field" id="su-country" ${d}>
          <option value="IN">India</option><option value="SG">Singapore</option>
          <option value="PT">Portugal</option><option value="GH">Ghana</option>
          <option value="AE">United Arab Emirates</option><option value="GB">United Kingdom</option>
          <option value="US">United States</option>
        </select>
        <span style="font-size:12px;color:var(--faint);">Sets how you are billed for tokens.</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-bio">Professional description</label>
        <textarea class="field" id="su-bio" maxlength="2048" ${d} style="height:120px;resize:vertical;font-size:13.5px;line-height:1.6;"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="btn" ${d} onclick="signUp()">${a.busy ? 'Creating…' : 'Create account'}</button>
        <button ${d} onclick="S.auth.step='signin';S.auth.error=null;render();"
          style="background:none;border:none;font-size:13px;color:var(--ink-soft);">I already have an account</button>
      </div>`);
  }

  return shell(`
    <div style="display:flex;flex-direction:column;gap:10px;">
      <h1 class="serif" style="margin:0;font-size:clamp(28px,5vw,36px);font-weight:400;letter-spacing:-.02em;">A smaller network.</h1>
      <p style="margin:0;font-size:15px;color:var(--ink-soft);line-height:1.65;max-width:44ch;text-wrap:pretty;">Invitation-only, no feed, and every introduction costs a token. Sign in with your email — there is no password to remember.</p>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <button class="btn" onclick="S.auth.step='signup';render();">Create an account</button>
      <button class="btn ghost" onclick="S.auth.step='signin';render();">Sign in</button>
    </div>`);
}

/* ---------- modal + router ---------- */
function modalHtml() {
  if (S.modal !== 'invite') return '';
  const after = Math.max(0, (S.me ? S.me.tokenBalance : 1) - 1);
  return `<div class="scrim" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Send an invitation">
      <div style="display:flex;flex-direction:column;gap:7px;">
        <h2 class="serif" style="margin:0;font-size:26px;font-weight:400;letter-spacing:-.01em;">Send an invitation</h2>
        <p style="margin:0;font-size:13.5px;color:var(--ink-soft);">They will get one email from you. Not a reminder sequence.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="inv-email">Their email</label>
        <input class="field mono" id="inv-email" type="email" placeholder="name@company.com" style="font-size:13.5px;">
      </div>
      <div style="border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span class="lbl">Your balance</span>
          <span style="font-size:12.5px;color:var(--ink-soft);">Deducted the moment you send</span>
        </div>
        <div style="display:flex;align-items:center;gap:13px;">
          <span class="mono" style="font-size:25px;color:var(--ghost);text-decoration:line-through;">${S.me ? S.me.tokenBalance : "—"}</span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.6"><path d="M4 12 H19 M14 7 L19 12 L14 17"/></svg>
          <span class="mono" style="font-size:25px;font-weight:500;">${after}</span>
        </div>
      </div>
      <div style="display:flex;gap:12px;background:var(--sunk);padding:15px 16px;">
        <span style="color:var(--good);display:flex;flex-shrink:0;">${RETURN}</span>
        <span style="font-size:13px;color:var(--ink-2);line-height:1.6;">If they decline, or do not respond within 7 days, your token comes back automatically.</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;">
        <button onclick="closeModal()" style="background:none;border:none;font-size:13.5px;color:var(--ink-soft);padding:13px 4px;">Cancel</button>
        <button class="btn" ${S.sending ? "disabled" : ""} onclick="sendInvite()"><span style="display:flex;">${COIN}</span>${S.sending ? "Sending…" : "Send invitation — 1 token"}</button>
      </div>
    </div></div>`;
}

function view() {
  if (APP === 'bms' && !signedIn()) return vBmsLogin();
  if (APP === 'portal' && !signedIn()) return vPortalAuth();
  if (APP === 'portal' && S.dataError) {
    return topbar('') + `<div class="wrap"><div class="col">${emptyState(
      'Could not load your account', S.dataError,
      `<button class="btn" onclick="S.dataError=null;S.me=null;render();">Try again</button>`)}</div></div>`;
  }
  if (APP === 'portal' && !S.me) {
    return `<div class="wrap"><div class="col"><p style="font-size:13.5px;color:var(--ink-soft);">Loading…</p></div></div>`;
  }
  const h = location.hash || homeForApp();
  if (h === '#/signup') return vSignup();
  if (h === '#/welcome') return vWelcome();
  if (h === '#/start') return vFirstRun();
  if (h === '#/invitations') return vInvitations();
  if (h === '#/gatekeeper') return vGatekeeper();
  if (h === '#/tokens') return vTokens();
  if (h === '#/bms/users') return vBmsUsers();
  if (h === '#/bms/invitations') return vBmsInv();
  if (h === '#/bms/webhooks') return vBmsHooks();
  if (h.startsWith('#/p/')) return vProfile(h.slice(4));
  return APP === 'bms' ? vBmsUsers() : vNetwork();
}
function homeForApp() { return APP === 'bms' ? '#/bms/users' : '#/network'; }

function renderNotice() {
  const el = document.getElementById('notice');
  if (!el) return;
  const bms = APP === 'bms';
  el.innerHTML = `<div style="background:${bms ? '#20262E' : '#2A2018'};color:${bms ? '#AEB8C4' : '#C9BCA8'};
      font-size:11.5px;letter-spacing:.02em;padding:7px 18px;text-align:center;">
    ${bms ? 'Preview — sample data remains on the webhooks page.'
          : 'Preview — payments are not connected yet.'}
  </div>`;
}

function render() {
  renderNotice();
  // Nothing truthful can be rendered until the first load returns.
  if (APP === 'portal' && signedIn() && !S.me && !S.dataError && !S.loading) loadPortal();
  if (APP === 'bms' && signedIn() && !S.stats && !S.dataError && !S.loading) loadBms();

  // portal must not serve the admin console, and bms must not serve the user
  // app: they are different hostnames with different audiences.
  let h = location.hash || homeForApp();
  const isBms = h.indexOf('#/bms/') === 0;
  if ((APP === 'portal' && isBms) || (APP === 'bms' && !isBms)) { h = homeForApp(); location.hash = h; }
  document.getElementById('app').innerHTML = view();
  document.getElementById('layer').innerHTML = modalHtml() + versionTip()
    + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');
}
addEventListener('hashchange', render);
watchForNewVersion();
if (!location.hash) location.hash = homeForApp();
render();
</script>
