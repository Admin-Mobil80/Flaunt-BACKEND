/**
 * An invitation link arrives as ?invite=<id>&email=<address>. Prefilling the
 * address matters more than it looks: the recipient never chose it, and one
 * mistyped character creates an unrelated account whose sign-in code goes to a
 * mailbox they are not watching.
 */
var INVITE = (function () {
  try {
    const q = new URLSearchParams(location.search);
    const email = (q.get('email') || '').trim().toLowerCase();
    // `existing` is set by the sender at the time the email went out, so the
    // recipient lands on the right form instead of being told to create an
    // account they already have. It is a snapshot, not a guarantee: if it is
    // wrong in either direction the flows recover — sign-up falls through to
    // sign-in on UsernameExists, and sign-in offers to create an account.
    return email ? {
      email,
      inviteId: q.get('invite') || null,
      existing: q.get('existing') === '1',
    } : null;

})();

      ${S.second.length ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--faint);">Showing ${S.second.length} of ${S.secondTotal}${q ? ` · ${second.length} match the filter` : ''}</span>
        ${S.secondHasMore ? `<button class="btn ghost" ${S.secondLoading ? 'disabled' : ''} onclick="loadSecond(${S.secondOffset})"
          style="padding:8px 16px;font-size:13px;">${S.secondLoading ? 'Loading…' : 'Load more'}</button>` : ''}
      </div>
      <span style="font-size:11.5px;color:var(--faint);padding-top:8px;">The filter searches the rows you have loaded, not the whole network.</span>` : ''}
    </div>`}
  </div></div>`;
}

/**
 * Loads a direct contact's own connections. Lazy, on request: it is a read per
 * contact-of-contact, and most profile views never ask for it.
 */
async function loadTheirConnections(userId) {
  S.viewing = { ...S.viewing, theirsLoading: true };
  render();
  try {
    const d = await gql(`query C($id:ID!){ connectionsOf(userId:$id){
      userId name designation organisation degree viaName viaUserId photoAt bio } }`, { id: userId });
    S.viewing = { ...S.viewing, theirs: d.connectionsOf || [], theirsLoading: false, theirsError: null };
  } catch (e) {
    S.viewing = { ...S.viewing, theirs: [], theirsLoading: false, theirsError: e.message };
  }
  render();
}

async function openProfile(userId) {
  S.viewing = { loading: true, userId, profile: null, error: null };
  render();
  try {
    const d = await gql(`query P($id:ID!){ profile(userId:$id){
      userId name designation organisation location bio country
      primaryEmail secondaryEmail secondaryEmailUnverified connectedAt degree viaName viaUserId photoAt
      viaOptions { userId name designation photoAt } } }`, { id: userId });
    S.viewing = { loading: false, userId, profile: d.profile, error: null, theirs: null, theirsLoading: false, tab: 'details' };
  } catch (e) {
    S.viewing = { loading: false, userId, profile: null, error: e.message };
  }
  render();
}

/**
 * Statuses are stored as machine constants; nobody should have to read
 * PENDING_GATEKEEPER. It also overflowed its column.
 */
function statusLabel(st) {
  return ({
    PENDING: 'Waiting',
    PENDING_GATEKEEPER: 'With introducer',
    INTRO_PENDING: 'With them',
    ACCEPTED: 'Accepted',
    REJECTED: 'Declined',
    GATEKEEPER_DENIED: 'Not passed on',
    EXPIRED: 'Expired',
    CANCELLED: 'Withdrawn',
  })[st] || String(st || '').replace(/_/g, ' ').toLowerCase();
}

/**
 * Direction tabs for the two inbox pages.
 *
 * Stacking "waiting on you" above "you asked for" put two different jobs on one
 * screen — things needing a decision and things needing patience. They read as
 * one list. Splitting them makes the actionable half the default.
 */
function dirTabs(active, key, tabs) {
  return `<div style="display:flex;gap:24px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap;">
    ${tabs.map(([id, label, n]) => {
      const on = active === id;
      return `<button onclick="S.${key}='${id}';render();" aria-current="${on}"
        style="background:none;border:none;border-bottom:1.5px solid ${on ? 'var(--accent)' : 'transparent'};
          color:${on ? 'var(--ink)' : 'var(--ink-soft)'};font-weight:${on ? 500 : 400};font-size:13.5px;
          padding:0 0 10px;display:flex;align-items:center;gap:7px;">
        ${label}<span class="mono" style="font-size:11px;color:${n ? 'var(--accent)' : 'var(--faint)'};">${n}</span></button>`;
    }).join('')}
  </div>`;
}

/**
 * Opening one request does not close the others: a gatekeeper comparing two
 * asks about the same person should be able to see both at once.
 */
function toggleGk(id, singleOpenByDefault) {
  if (!S.gkOpen) {
    // Seed from what is currently on screen so the first click toggles what the
    // reader sees, rather than silently flipping to a different default.
    S.gkOpen = {};
    if (singleOpenByDefault) S.gkOpen[id] = true;
  }
  S.gkOpen[id] = !S.gkOpen[id];
  render();
}

function vGatekeeperInbox() {

    ? {bd:'var(--warn-line)',bg:'var(--warn-wash)',fg:'var(--warn)'}

        <span class="lbl">To meet</span><span class="lbl">Through</span><span class="lbl">State</span><span class="lbl">Token</span>
      </div>
      ${mine.map((r) => { const t = tone(r.status); return `<div class="lrow" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) 152px minmax(0,110px);">
        <span class="trunc" style="font-family:var(--serif);font-size:15px;">${esc(r.targetName || r.recipientEmail || 'Someone')}</span>
        <span class="trunc hide-sm" style="font-size:12.5px;color:var(--ink-soft);">${esc(r.gatekeeperName || '—')}</span>
        <span><span class="chip" style="border-color:${t.bd};background:${t.bg};padding:2px 7px;"><span class="dot" style="background:${t.fg};"></span><span class="lbl" style="color:${t.fg};font-size:9.5px;white-space:nowrap;">${esc(statusLabel(r.status))}</span></span></span>

      </div>`; }).join('')}
    </div>` : emptyState('You have not asked for any introductions',
        'Open a second-degree profile and ask whoever you both know to make the introduction.', '')) : ''}
    ${gkTab !== 'inbox' ? '' : `
    ${S.gkError ? `<p style="font-size:13px;color:var(--bad);">${esc(S.gkError)}</p>` : ''}
    ${S.gkLoading ? `<p style="font-size:13.5px;color:var(--ink-soft);">Loading…</p>` : ''}
    ${!S.gkLoading && rs.length === 0 ? emptyState('Nothing waiting on you',
      'When someone you know asks to be introduced to another of your connections, it appears here.', '') : ''}`}
    ${gkTab !== 'inbox' ? '' : rs.map((r) => {
      // A single request is opened for you — there is nothing to tidy and one

      const open = S.gkOpen ? S.gkOpen[r.inviteId] === true : rs.length === 1;
      return `<div style="border:1px solid var(--rule-2);background:var(--raised);display:flex;flex-direction:column;">
      <button onclick="toggleGk('${r.inviteId}', ${rs.length === 1})" aria-expanded="${open}"
        style="background:none;border:none;text-align:left;padding:16px 22px;display:flex;align-items:center;gap:14px;width:100%;">
        ${avatarHtml({ userId: r.requesterUserId, name: r.requesterName, photoAt: r.requesterPhotoAt }, 30, 'flex:none;')}
        <span style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;">
          <span class="serif trunc" style="font-size:16px;">${esc(r.requesterName)} &rarr; ${esc(r.targetName)}</span>
          <span class="trunc" style="font-size:12px;color:var(--ink-soft);">${esc(r.requesterDesignation || 'Wants an introduction')}</span>

      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="gk-note-${r.inviteId}">Add a note
          <span style="color:var(--warn);">Required</span>
          <span style="text-transform:none;letter-spacing:0;color:var(--faint);">&mdash; it is what makes this an introduction rather than a forwarded form</span></label>
        <textarea id="gk-note-${r.inviteId}" maxlength="600"
          placeholder="Why you think they should meet. ${esc(r.targetName.split(' ')[0])} sees this alongside ${esc(r.requesterName.split(' ')[0])}&rsquo;s profile."
          style="border:1px solid var(--rule-2);background:var(--raised);padding:11px 13px;font-size:13.5px;

      </div>

function vProfile(id) {
  const v = S.viewing;
  if (!v || v.userId !== id) { openProfile(id); return topbar('network') + `<div class="wrap"><div class="col"><p style="font-size:13.5px;color:var(--ink-soft);">Loading…</p></div></div>`; }
  if (v.loading) return topbar('network') + `<div class="wrap"><div class="col"><p style="font-size:13.5px;color:var(--ink-soft);">Loading…</p></div></div>`;
  if (v.error || !v.profile) {
    return topbar('network') + `<div class="wrap"><div class="col">
      ${backlink('Network','#/network')}
      ${emptyState('Profile unavailable', v.error || 'That person could not be found.',
        `<button class="btn" onclick="S.viewing=null;go('#/network');">Back to your network</button>`)}
    </div></div>`;
  }

  const p = v.profile;
  const first = p.degree === 1 || p.degree === 0;
  // Opening the connections tab is what asks for the data — it is a read per
  // contact-of-contact, so it is not fetched with the profile itself.
  if (first && (v.tab || 'details') === 'connections' && v.theirs === null && !v.theirsLoading) {
    loadTheirConnections(p.userId);
  }
  const second = p.degree === 2;
  const badge = first
    ? `<span class="chip" style="border-color:var(--good-line);background:var(--good-wash);"><span class="dot" style="background:var(--good);"></span><span class="lbl" style="color:var(--good);">${p.degree === 0 ? 'You' : '1st degree'}</span></span>`
    : (second
      ? `<span class="chip" style="border-color:var(--warn-line);background:var(--warn-wash);"><span class="dot" style="background:var(--warn);"></span><span class="lbl" style="color:var(--warn);">2nd degree</span></span>`
      : `<span class="chip" style="border-color:var(--rule-2);background:var(--sunk);"><span class="dot" style="background:var(--faint);"></span><span class="lbl">Not connected</span></span>`);

  const role = [p.designation, p.organisation].filter(Boolean).join(' · ');

  /**
   * Contact details render only for a direct connection. Below that the whole

   */
  const contact = first ? `
    <div style="display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--rule-2);padding-top:24px;">
      <span class="lbl">Contact</span>

          <span style="font-size:11.5px;color:var(--faint);">Primary email</span>

          <span style="font-size:11.5px;color:var(--faint);">Secondary email${p.secondaryEmailUnverified ? ' · unconfirmed' : ''}</span>

  return topbar('network') + `<div class="wrap" style="padding-top:clamp(24px,3vw,40px);"><div class="col" style="max-width:700px;gap:32px;">
    <button onclick="S.viewing=null;go('#/network');" style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);background:none;border:none;padding:0;align-self:flex-start;">${BACK_ARROW}Network</button>

          ${badge}

        ${role ? `<span style="font-size:14.5px;color:var(--ink-2);">${esc(role)}</span>` : ''}
        ${p.location ? `<span style="font-size:13px;color:var(--ink-soft);">${esc(p.location)}</span>` : ''}
      </div>
    </div>

    ${first ? `<div style="display:flex;gap:24px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap;">
      ${['details','connections'].map((t) => {
        const on = (v.tab || 'details') === t;
        const label = t === 'details' ? 'Details' : `${esc((p.name || '').split(' ')[0])}&rsquo;s connections`;
        return `<button onclick="S.viewing={...S.viewing,tab:'${t}'};render();" aria-current="${on}"
          style="background:none;border:none;border-bottom:1.5px solid ${on ? 'var(--accent)' : 'transparent'};

          ${label}</button>`;
      }).join('')}
    </div>` : ''}

    ${(v.tab || 'details') !== 'details' ? '' : `
    ${p.bio ? `<div style="display:flex;flex-direction:column;gap:12px;">
      <span class="lbl">Professional description</span>
      <p style="margin:0;font-size:15px;line-height:1.72;color:var(--ink-2);max-width:62ch;text-wrap:pretty;">${esc(p.bio)}</p>

    ${contact}

    ${second && (p.viaOptions || []).length ? `<div style="border:1px solid var(--rule-2);background:var(--raised);padding:24px 26px;display:flex;flex-direction:column;gap:18px;">

        </div>`).join('')}
      </div>

      <span style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;">One token, spent when you ask. It comes back if they pass, if ${esc((p.name || '').split(' ')[0])} declines, or if nobody responds within seven days.</span>
    </div>` : ''}
    `}

    ${p.degree === 1 && (v.tab || 'details') === 'connections' ? `<div style="display:flex;flex-direction:column;gap:0;">
      <div class="lrow hide-sm" style="grid-template-columns:26px minmax(104px,.95fr) minmax(0,1.05fr) minmax(0,1.2fr) 124px 22px;border-bottom:1px solid var(--rule-2);padding-bottom:8px;">
        <span></span><span class="lbl">Name</span><span class="lbl">Role</span><span class="lbl">Description</span><span class="lbl">Relationship</span><span></span>
      </div>
      ${v.theirsLoading ? `<p style="margin:14px 0;font-size:13px;color:var(--ink-soft);">Loading…</p>` : ''}
      ${v.theirs && v.theirs.length ? v.theirs.map((c) => {
        const crole = [c.designation, c.organisation].filter(Boolean).join(' · ');
        // The whole row opens the profile. Introducing is a decision worth a
        // token, so it belongs on the page that shows who the person is.
        return `<div class="lrow lrow-click" onclick="S.viewing=null;go('#/p/${c.userId}')" role="link" tabindex="0"
            onkeydown="if(event.key==='Enter'){S.viewing=null;go('#/p/${c.userId}')}"
            style="grid-template-columns:26px minmax(104px,.95fr) minmax(0,1.05fr) minmax(0,1.2fr) 124px 22px;">
          ${avatarHtml(c, 26, 'background:#F3EDE4;')}
          <span class="trunc" style="font-family:var(--serif);font-size:15px;">${esc(c.name)}</span>

function vInvitations() {
  // Connection invitations only. An introduction request is a different thing
  // with a different counterparty, and it has its own destination now.
  const sent = (S.invites || []).filter((r) => r.type !== 'INTRO');
  const waitingOnYou = (S.incoming || []).filter((r) =>
    r.type !== 'INTRO' && ['PENDING','PENDING_GATEKEEPER','INTRO_PENDING'].indexOf(r.status) > -1);
  const invTab = S.invTab || (waitingOnYou.length ? 'inbox' : 'sent');

const PAGE = 50;

const Q_USERS = `query Users($o:Int!,$q:String){
  adminUsers(limit: ${PAGE}, offset: $o, q: $q) {
    total hasMore items { userId name email country tokenBalance connectionCount createdAt } }
}`;

const Q_ADMIN = `query Admin($o:Int!) {
  adminStats { totalUsers usersIndia usersInternational tokensOutstanding tokensConsumed tokensRefunded }
  adminUsers(limit: ${PAGE}, offset: $o) {
    total hasMore items { userId name email country tokenBalance connectionCount createdAt } }
  adminInvitations { inviteId recipientEmail status type createdAt daysLeft tokenOutcome }
  adminPricingConfig { tokensPerBundle allowedSizes signupTokens signupRange updatedAt updatedBy }
  adminPaymentConfig { mode modes secretName live updatedAt updatedBy }
  adminStaff { email name role status addedBy createdAt }
  adminWhoAmI { email role }
}`;

async function loadBms() {
  S.loading = true; S.dataError = null; render();
  try {
    const d = await gql(Q_ADMIN, { o: (S.userPage || 0) * PAGE });
    S.stats = d.adminStats;
    S.users = d.adminUsers?.items || [];
    S.usersTotal = d.adminUsers?.total ?? 0;
    S.adminInvites = d.adminInvitations || [];
    S.pricing = d.adminPricingConfig;
    S.payment = d.adminPaymentConfig;
    S.staff = d.adminStaff || [];
    S.whoAmI = d.adminWhoAmI || null;
  } catch (e) { S.dataError = e.message; }
  finally { S.loading = false; render(); }
}

/**
 * Paging refetches only the page. The stats, invitations and settings on this
 * screen do not change when you move to row 51, and re-reading them would make
 * every page turn as slow as a cold load.
 */
async function gotoUserPage(page) {
  const total = S.usersTotal ?? ((S.stats && S.stats.totalUsers) || 0);
  const max = Math.max(0, Math.ceil(total / PAGE) - 1);
  const next = Math.min(Math.max(0, page), max);
  if (next === (S.userPage || 0)) return;
  S.userPage = next; S.usersLoading = true; render();
  try {
    const d = await gql(Q_USERS, { o: next * PAGE, q: (S.userQuery || '').trim() || null });
    S.users = d.adminUsers?.items || [];
    S.usersTotal = d.adminUsers?.total ?? 0;
  } catch (e) { toast(e.message); }
  finally { S.usersLoading = false; render(); }
}


/**
 * Switching to live means real cards are charged, so it asks first. Switching
 * back to test is harmless and does not.
 */
async function setPaymentMode(mode) {
  if (mode === 'live') {
    const ok = confirm('Switch to the LIVE Razorpay gateway?\n\nReal cards will be charged and real money will move. Only do this when you are ready to take payments.');
    if (!ok) return;
  }
  try {
    await gql(`mutation SetM($m:String!){ adminSetPaymentMode(mode:$m){ mode live secretName } }`, { m: mode });
    await loadBms();
    toast(mode === 'live' ? 'LIVE gateway active — real cards will be charged.' : 'Test gateway active. No real money moves.');
  } catch (e) { toast(e.message); }
}

async function setSignupTokens(tokens) {
  try {
    await gql(`mutation SetS($t:Int!){ adminSetSignupTokens(tokens:$t){ signupTokens } }`, { t: tokens });
    await loadBms();
    toast(`New accounts now start with ${tokens} token${tokens === 1 ? '' : 's'}.`);
  } catch (e) { toast(e.message); }
}

async function setBundleSize(tokens) {
  try {
    await gql(`mutation SetB($t:Int!){ adminSetTokensPerBundle(tokens:$t){ tokensPerBundle updatedAt updatedBy } }`,
      { t: tokens });
    await loadBms();
    toast('A bundle now contains ' + tokens + ' tokens.');
  } catch (e) { toast(e.message); }
}

  S.userQuery = value;

async function reloadUsers() {
  const forQuery = (S.userQuery || '').trim();
  try {
    const d = await gql(Q_USERS, { o: 0, q: forQuery || null });
    if ((S.userQuery || '').trim() !== forQuery) return;
    S.users = d.adminUsers?.items || [];
    S.usersTotal = d.adminUsers?.total ?? 0;

  finally { S.usersLoading = false; render(); }
}

const TX_PAGE = 50;

/** Payments are loaded on demand — the ledger screen should not wait on them. */
async function loadTx(page, mode) {
  if (mode !== undefined) { S.txMode = mode; S.txPage = 0; } else { S.txPage = Math.max(0, page); }
  // Defaults to whichever environment billing is actually running in, so the
  // screen opens on the money that is currently moving.
  if (!S.txMode) S.txMode = (S.payment && S.payment.mode) || 'test';
  S.txLoading = true; S.txError = null; render();
  try {
    const d = await gql(`query Tx($l:Int!,$o:Int!,$m:String){ adminPayments(limit:$l, offset:$o, mode:$m){
      total paidCount hasMore gross { currency minor }
      items { orderId paymentId userId memberName memberEmail status mode tokens currency totalMinor createdAt paidAt } } }`,
      { l: TX_PAGE, o: S.txPage * TX_PAGE, m: S.txMode });
    S.tx = d.adminPayments;
  } catch (e) { S.txError = e.message; }
  finally { S.txLoading = false; render(); }
}

/** Minor units to a readable amount. Money is never held as a float. */
function money(cur, minor) {
  const sym = cur === 'INR' ? '\u20B9' : cur === 'USD' ? '$' : '';
  return sym + (Number(minor || 0) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function addStaff() {
  const email = (document.getElementById('staff-email') || {}).value || '';
  const name = (document.getElementById('staff-name') || {}).value || '';
  if (!email.trim()) { toast('Enter an email address.'); return; }
  S.staffBusy = true; render();
  try {
    await gql(`mutation A($e:String!,$n:String){ adminAddStaff(email:$e, name:$n){ email role } }`,
      { e: email.trim(), n: name.trim() || null });
    toast(`${email.trim()} can now sign in to the console.`);
    await loadBms();
  } catch (e) { toast(e.message); }
  finally { S.staffBusy = false; render(); }
}

async function removeStaff(email) {
  if (!confirm(`Remove console access for ${email}?\n\nTheir sign-in account is deleted. Member data is untouched.`)) return;

    await gql(`mutation R($e:String!){ adminRemoveStaff(email:$e) }`, { e: email });
    toast(`${email} no longer has access.`);
    await loadBms();
  } catch (e) { toast(e.message); }
}

/**
 * AppSync call carrying the Cognito id token. Errors come back in a 200 body,
 * so the GraphQL errors array is checked before the payload is trusted.
 */
async function gql(query, variables) {
  const s = session();
  if (!s || !s.idToken) throw new Error('Your session has expired. Sign in again.');
  if (!API_READY) throw new Error('This build has no API endpoint configured.');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: s.idToken },
    body: JSON.stringify({ query, variables: variables || {} })
  });
  const body = await res.json().catch(() => ({}));
  if (body.errors && body.errors.length) throw new Error(body.errors[0].message || 'Request failed');
  if (!res.ok) throw new Error('Request failed (' + res.status + ')');
  return body.data;
}

/**
 * Resizes in the browser before anything is uploaded.
 *
 * The alternative is accepting whatever the phone produced — a twelve megabyte
 * photograph — and shrinking it server-side, which means paying to receive it,
 * paying to store it, and running an image pipeline. A canvas does the same job
 * on the device for free, and the bucket only ever holds files this size.
 */
function resizeToWebp(file, px) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      // Square, centre-cropped: every avatar is a circle, so anything outside
      // the shortest side was never going to be seen.
      const side = Math.min(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = px; c.height = px;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, px, px);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('Could not read that image')), 'image/webp', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not an image we can read')); };
    img.src = url;
  });
}

async function uploadPhoto(input) {
  const file = input && input.files && input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast('Choose an image file.'); return; }
  // Clear it, or picking the same file twice in a row fires no change event.
  input.value = '';
  await uploadPhotoBlob(file);
}

async function uploadPhotoBlob(file) {
  S.photoBusy = true; S.profileError = null; render();
  try {
    const d = await gql(`mutation { createPhotoUpload { uploads { size pixels url } } }`);
    await Promise.all(d.createPhotoUpload.uploads.map(async (u) => {
      const blob = await resizeToWebp(file, u.pixels);
      const r = await fetch(u.url, { method: 'PUT', body: blob, headers: { 'content-type': 'image/webp' } });
      if (!r.ok) throw new Error('The upload was refused. Try again.');
    }));
    const c = await gql(`mutation { confirmPhotoUpload { userId name email designation organisation location bio country tokenBalance createdAt connectionCount secondaryEmail photoAt } }`);
    S.me = c.confirmPhotoUpload;
    toast('Photo updated.');

  finally { S.photoBusy = false; render(); }
}

/**
 * A live preview, used only where the native camera is not reachable.
 *
 * getUserMedia needs a secure context and explicit consent, and either can be
 * refused — so every failure lands on the file chooser rather than a dead end.
 */
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('This browser cannot open the camera. Choose a photo instead.');
    return;
  }
  S.modal = 'camera'; render();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false,
    });
    S.cameraStream = stream;
    const v = document.getElementById('cam-video');
    if (v) { v.srcObject = stream; await v.play().catch(() => {}); }
    else { closeCamera(); }
  } catch (e) {
    closeCamera();
    toast(e && e.name === 'NotAllowedError'
      ? 'Camera access was refused. Choose a photo instead.'
      : 'No camera available. Choose a photo instead.');
  }
}

function closeCamera() {
  if (S.cameraStream) {
    // Leaving the track running keeps the recording light on, which is
    // alarming and looks like the page is still watching.
    S.cameraStream.getTracks().forEach((t) => t.stop());
    S.cameraStream = null;
  }
  if (S.modal === 'camera') S.modal = null;
  render();
}

async function takePhoto() {
  const v = document.getElementById('cam-video');
  if (!v || !v.videoWidth) { toast('The camera is not ready yet.'); return; }
  const side = Math.min(v.videoWidth, v.videoHeight);
  const c = document.createElement('canvas');
  c.width = side; c.height = side;
  const ctx = c.getContext('2d');
  // Mirrored, because a preview that does not mirror reads as someone else.
  ctx.translate(side, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, side, side);
  const blob = await new Promise((r) => c.toBlob(r, 'image/webp', 0.9));
  closeCamera();
  if (blob) await uploadPhotoBlob(blob);
}

/**
 * After authenticating through an invitation link, the invitation is loaded and
 * the user is asked to accept or decline. Deliberately not auto-accepted:
 * accepting reveals both parties' contact details to each other, which is not
 * something to do on someone's behalf because they clicked a link in an email.
 */
async function loadInviteFromLink() {
  if (!INVITE || !INVITE.inviteId) return false;
  try {
    const d = await gql(`query Inv($id:ID!){ invitation(inviteId:$id){
      inviteId senderName senderDesignation recipientEmail status daysLeft } }`, { id: INVITE.inviteId });
    if (d.invitation && d.invitation.status !== 'ACCEPTED') { S.pendingInvite = d.invitation; return true; }
  } catch (e) {
    S.inviteError = e.message;
    return true;
  }
  return false;
}

async function respondToInvite(accept) {
  S.responding = true; S.inviteError = null; render();
  const op = accept ? 'acceptInvitation' : 'declineInvitation';
  try {
    await gql(`mutation R($id:ID!){ ${op}(inviteId:$id){ inviteId status } }`, { id: S.pendingInvite.inviteId });
    S.pendingInvite = null;
    // Clear the link params so a reload does not re-enter this flow.
    history.replaceState(null, '', location.pathname);
    await refreshPortal();
    S.landed = true;
    go(accept ? '#/network' : homeAfterAction());
    toast(accept ? 'Connected. You can both see each other in full now.' : 'Declined. Their token has been returned.');
  } catch (e) {
    S.inviteError = e.message;
  } finally { S.responding = false; render(); }
}

const SECOND_PAGE = 50;

/** Fetches one page of the second degree. Thousands of contacts cannot arrive at once. */
async function loadSecond(offset = 0) {
  S.secondLoading = true; render();
  // Captured now so a slow reply for an older query cannot overwrite a newer
  // one — typing fast otherwise leaves the results of a prefix on screen.
  const forQuery = (S.netFilter || '').trim();
  try {
    const d = await gql(`query S($l:Int!,$o:Int!,$q:String){ secondDegree(limit:$l, offset:$o, q:$q){
      items { userId name designation organisation viaName viaUserId photoAt bio } total hasMore } }`,
      { l: SECOND_PAGE, o: offset, q: forQuery || null });
    if ((S.netFilter || '').trim() !== forQuery) return;
    const page = d.secondDegree;
    S.second = offset === 0 ? page.items : [...S.second, ...page.items];
    S.secondTotal = page.total;
    S.secondHasMore = page.hasMore;
    S.secondOffset = offset + page.items.length;
  } catch (e) { S.secondError = e.message; }
  finally { S.secondLoading = false; S.secondLoaded = true; render(); }
}

/**
 * Direct connections are all in memory, so they filter instantly on the client.
 * The second degree is paged and can run to thousands, so it has to be searched
 * on the server — otherwise the box only ever sees the fifty rows on screen.
 */
function onNetFilter(value) {
  S.netFilter = value;
  if (S.netTab !== 'second') { render(); return; }
  clearTimeout(S._netTimer);
  S.secondSearching = true; render();
  S._netTimer = setTimeout(() => {
    S.secondSearching = false;
    S.second = []; S.secondOffset = 0; S.secondLoaded = false;
    loadSecond(0);
  }, 300);
}

async function decideIntroduction(inviteId, approve, requesterName, targetName) {

  if (!approve && !confirm(`Decline the introduction between ${requesterName} and ${targetName}?\n\n${requesterName} is told you passed, not why, and their token is returned.`)) return;
  // Read the note before anything re-renders and destroys the textarea.

  // nothing to write; vouching is the act that needs words behind it.

function loadRazorpay() {
  if (window.Razorpay) return Promise.resolve(true);
  return new Promise((resolve) => {
    const el = document.createElement('script');
    el.src = 'https://checkout.razorpay.com/v1/checkout.js';
    el.onload = () => resolve(true);
    el.onerror = () => resolve(false);
    document.head.appendChild(el);
  });
}

/**
 * Opens Razorpay Checkout for one bundle.
 *
 * The amount is not passed from here — the server computed it from the account's
 * own country and told Razorpay when it created the order, so a tampered client
 * cannot change what is charged.
 *
 * Nothing is credited on success either. The handler below only tells the user
 * their payment went through; the tokens arrive when Razorpay's webhook reaches
 * the backend, which is the only path that can be trusted. So the balance is
 * re-read a moment later rather than incremented optimistically.
 */
async function buyTokens() {
  S.buying = true; render();
  try {
    const ok = await loadRazorpay();
    if (!ok) throw new Error('Could not reach the payment provider. Check your connection and try again.');

    const d = await gql(`mutation { createPaymentOrder { orderId keyId amountMinor currency tokens mode } }`);
    const o = d.createPaymentOrder;

    const rzp = new window.Razorpay({
      key: o.keyId,
      order_id: o.orderId,
      name: 'Flaunt',
      description: `${o.tokens} tokens`,
      prefill: { email: S.me?.email || '', name: S.me?.name || '' },
      theme: { color: '#6E2B2B' },
      handler: async () => {
        toast('Payment received. Your tokens will appear in a moment.');
        // The webhook credits the balance, so poll briefly rather than assume.
        for (let i = 0; i < 6; i++) {
          await new Promise((r) => setTimeout(r, 1500));
          const before = S.me?.tokenBalance;
          await refreshPortal();
          if (S.me?.tokenBalance !== before) { toast(`${o.tokens} tokens added.`); break; }
        }
      },
      modal: { ondismiss: () => { S.buying = false; render(); } },
    });
    rzp.on('payment.failed', (resp) => {
      toast(resp?.error?.description || 'The payment did not go through.');
      S.buying = false; render();
    });
    rzp.open();
  } catch (e) {
    toast(e.message || 'Could not start the payment.');
  } finally {
    S.buying = false; render();
  }
}

/**
 * A long-open tab keeps running the release it loaded. version.json is served
 * uncached, so comparing it to this build's id is how the tab learns it is
 * behind — then it offers a refresh rather than reloading under the user.

function watchForNewVersion() {
  if (!BUILD_ID || BUILD_ID.indexOf('__') === 0) return;
  setInterval(async () => {

      if (v && v.build && v.build !== BUILD_ID && !S.newVersion) { S.newVersion = true; render(); }
    } catch (e) { /* offline or transient — try again next tick */ }
  }, 90000);
}

/* ---------- BMS sign-in: passwordless email OTP (Cognito CUSTOM_AUTH) ---------- */
const IDP = () => `https://cognito-idp.${AUTH.region}.amazonaws.com/`;
async function idp(target, body) {
  const res = await fetch(IDP(), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-amz-json-1.1',
      'X-Amz-Target': `AWSCognitoIdentityProviderService.${target}`
    },
    body: JSON.stringify(body)
  });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { /* non-JSON error body */ }
  if (!res.ok) {
    const type = String(data.__type || '').split('#').pop();
    throw Object.assign(new Error(data.message || type || 'Sign-in failed'), { type });
  }
  return data;
}
function session() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
}
function signedIn() {
  const s = session();
  return !!(s && s.idToken && s.expiresAt > Date.now());
}
/**
 * Signing out has to forget the person, not just the token.
 *
 * Clearing only the token left every field of theirs in memory — profile,
 * connections, invitations, balance. The next person to sign in on the same
 * tab then hit render()'s `!S.me` guard, which was already satisfied, so their
 * own data was never fetched and they were shown the previous member's account
 * under their own session. reset() rebuilds the whole state.
 */
function signOut() {
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  reset();
  S.auth = { step: APP === 'portal' ? 'choose' : 'email', email: APP === 'bms' ? 'riyad@mobil80.com' : '', busy: false, error: null, session: null };
  render();
}
async function sendCode() {
  const el = document.getElementById('auth-email');
  const email = (el ? el.value : '').trim().toLowerCase();
  if (!email) { S.auth.error = 'Enter your email address.'; render(); return; }
  S.auth.busy = true; S.auth.error = null; S.auth.email = email; render();
  try {
    const r = await idp('InitiateAuth', {
      AuthFlow: 'CUSTOM_AUTH', ClientId: AUTH.clientId, AuthParameters: { USERNAME: email }
    });
    S.auth.session = r.Session; S.auth.step = 'code';
  } catch (e) {
    // preventUserExistenceErrors is on, so an unknown address fails here the
    // same way a known one would. Say the neutral thing rather than confirming
    // whether the account exists.
    S.auth.error = e.type === 'NotAuthorizedException'
      ? 'That address cannot sign in to this console.'
      : (e.message || 'Could not send the code. Try again.');
  } finally { S.auth.busy = false; render(); }
}
async function verifyCode() {
  const el = document.getElementById('auth-code');
  const code = (el ? el.value : '').trim();
  if (code.length !== 6) { S.auth.error = 'Enter the six-digit code.'; render(); return; }
  S.auth.busy = true; S.auth.error = null; render();
  try {
    const r = await idp('RespondToAuthChallenge', {
      ChallengeName: 'CUSTOM_CHALLENGE', ClientId: AUTH.clientId, Session: S.auth.session,
      ChallengeResponses: { USERNAME: S.auth.email, ANSWER: code }
    });
    if (r.AuthenticationResult && r.AuthenticationResult.IdToken) {
      const a = r.AuthenticationResult;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        idToken: a.IdToken, email: S.auth.email,
        expiresAt: Date.now() + (a.ExpiresIn || 3600) * 1000
      }));
      S.auth.step = 'email'; S.auth.session = null;
    } else {
      // Cognito re-challenged: the code was wrong and rounds remain.
      S.auth.session = r.Session;
      S.auth.error = 'That code was not right. Try again.';
    }
  } catch (e) {
    S.auth.error = e.type === 'NotAuthorizedException'
      ? 'That code has expired or been used. Request a new one.'
      : (e.message || 'Could not verify the code.');
    if (e.type === 'NotAuthorizedException') { S.auth.step = 'email'; S.auth.session = null; }
  } finally { S.auth.busy = false; render(); }
}


/**
 * A password is required by the SignUp API but never used: the pool's client
 * enables only CUSTOM_AUTH, so there is no flow that could present it. It is
 * generated, sent once, and forgotten.
 */
function throwawayPassword() {
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/[^A-Za-z0-9]/g, '') + 'aA1!';
}
async function signUp() {
  const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const email = val('su-email').toLowerCase();
  const name = val('su-name');
  const designation = val('su-designation');
  const country = val('su-country');
  const bioAtSignup = val('su-bio');
  // Read with the rest, BEFORE anything re-renders. These two were read after
  // the busy-state render() below, which rebuilds the form from state and
  // therefore hands back empty inputs — so organisation and location were
  // silently dropped on every account ever created. The same mistake was fixed
  // in saveProfile and survived here.
  const org = val('su-org');
  const loc = val('su-location');
  // The form has always said this field is required and never enforced it.
  // An account created without one cannot save its profile at all afterwards:
  // updateProfile validates every field before writing, so an empty bio
  // rejects the whole save and takes the other fields down with it.
  if (!email || !name || !designation || !bioAtSignup) {
    S.auth.error = 'Email, full name, designation and professional description are all required.';
    render(); return;
  }
  S.auth.busy = true; S.auth.error = null; S.auth.email = email; render();
  const attrs = [
    { Name: 'email', Value: email },
    { Name: 'name', Value: name },
    { Name: 'custom:country', Value: country || 'IN' },
    { Name: 'custom:designation', Value: designation }
  ];
  if (org) attrs.push({ Name: 'custom:organisation', Value: org });
  if (loc) attrs.push({ Name: 'custom:location', Value: loc });
  attrs.push({ Name: 'custom:bio', Value: bioAtSignup });
  try {
    await idp('SignUp', {
      ClientId: AUTH.clientId, Username: email,
      Password: throwawayPassword(), UserAttributes: attrs
    });
  } catch (e) {
    if (e.type !== 'UsernameExistsException') {
      S.auth.busy = false;
      S.auth.error = e.message || 'Could not create the account.';
      render(); return;
    }
    // Already registered — fall through to sign-in rather than dead-ending.
  }
  try {
    const r = await idp('InitiateAuth', {
      AuthFlow: 'CUSTOM_AUTH', ClientId: AUTH.clientId, AuthParameters: { USERNAME: email }
    });
    S.auth.session = r.Session; S.auth.step = 'code';
  } catch (e) {
    S.auth.error = e.message || 'Account created, but the code could not be sent.';
  } finally { S.auth.busy = false; render(); }
}

      <div style="display:flex;flex-direction:column;gap:7px;">

        <input class="field mono" id="su-email" type="email" ${d} style="font-size:13.5px;"
          value="${esc(INVITE ? INVITE.email : (a.email || ''))}"${INVITE ? ' readonly' : ''}>
        ${INVITE ? `<span style="font-size:12px;color:var(--faint);">This is the address your invitation was sent to.</span>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-name">Full name</label>
        <input class="field" id="su-name" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-designation">Designation</label><span class="lbl" style="color:var(--warn);">Required</span></div>
        <input class="field" id="su-designation" maxlength="100" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-org">Organisation</label><span class="lbl">Optional</span></div>
        <input class="field" id="su-org" maxlength="100" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-location">Location</label><span class="lbl">Optional</span></div>
        <input class="field" id="su-location" maxlength="80" ${d}>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="su-country">Country</label>
        <select class="field" id="su-country" ${d}>
          <option value="IN">India</option><option value="SG">Singapore</option>
          <option value="PT">Portugal</option><option value="GH">Ghana</option>
          <option value="AE">United Arab Emirates</option><option value="GB">United Kingdom</option>
          <option value="US">United States</option>
        </select>
        <span style="font-size:12px;color:var(--faint);">Sets how you are billed for tokens.</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <div style="display:flex;justify-content:space-between;"><label class="lbl" for="su-bio">Professional description</label><span class="lbl" style="color:var(--warn);">Required</span></div>
        <textarea class="field" id="su-bio" maxlength="2048" ${d} style="height:120px;resize:vertical;font-size:13.5px;line-height:1.6;"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <button class="btn" ${d} onclick="signUp()">${a.busy ? 'Creating…' : 'Create account'}</button>
        <button ${d} onclick="S.auth.step='signin';S.auth.error=null;render();"
          style="background:none;border:none;font-size:13px;color:var(--ink-soft);">I already have an account</button>
      </div>`);
  }

  // The signed-out page is the only thing most visitors will ever see, so it
  // explains the product rather than presenting two bare buttons.
  const beat = (n, title, body) => `<div style="display:flex;gap:16px;align-items:flex-start;">
      <span class="mono" style="font-size:11px;color:var(--accent);padding-top:4px;min-width:18px;">${n}</span>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:14.5px;font-weight:500;color:var(--ink);">${title}</span>
        <span style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;max-width:52ch;">${body}</span>
      </div>
    </div>`;

  return `<div style="min-height:100vh;background:var(--paper);display:flex;flex-direction:column;">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;
        padding:20px clamp(20px,5vw,56px);border-bottom:1px solid var(--rule);">
      <span class="serif" style="font-size:23px;letter-spacing:.015em;">Flaunt</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn ghost" onclick="S.auth.step='signin';render();" style="padding:9px 16px;font-size:13.5px;">Sign in</button>
        <button class="btn" onclick="S.auth.step='signup';render();" style="padding:9px 16px;font-size:13.5px;">Create an account</button>
      </div>
    </header>

    <main style="flex-grow:1;padding:clamp(40px,7vw,84px) clamp(20px,5vw,56px);">
      <div style="max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:44px;">
        <div style="display:flex;flex-direction:column;gap:16px;">
          <h1 class="serif" style="margin:0;font-size:clamp(34px,6.5vw,52px);font-weight:400;letter-spacing:-.025em;line-height:1.1;text-wrap:balance;">A professional network you can finish reading.</h1>
          <p style="margin:0;font-size:16.5px;color:var(--ink-soft);line-height:1.7;max-width:56ch;text-wrap:pretty;">No feed. No algorithm. No one you have never met asking to connect. Flaunt is invitation-only, and every invitation costs the sender something — which is the whole point.</p>
          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;">
            <button class="btn" onclick="S.auth.step='signup';render();">Create an account</button>
            <button class="btn ghost" onclick="S.auth.step='signin';render();">Sign in</button>
          </div>
          <span style="font-size:12.5px;color:var(--faint);">No password. We email you a six-digit code.</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:22px;border-top:1px solid var(--rule-2);padding-top:34px;">
          <span class="lbl">How it works</span>
          ${beat('01','You start with ten tokens.','Granted when you join. They are the only currency here, and there is nothing else to buy.')}
          ${beat('02','Each invitation costs one.','Spent the moment you send it, so nobody can blanket the network. If it is declined, or goes unanswered for seven days, the token comes back.')}
          ${beat('03','Second-degree contacts stay private.','You can see who they are and what they do. Their email address stays masked until someone you both know introduces you.')}
        </div>

        <div style="border-top:1px solid var(--rule-2);padding-top:26px;">
          <p class="serif" style="margin:0;font-size:19px;line-height:1.55;color:var(--ink-2);max-width:48ch;text-wrap:pretty;">You only pay for the connections you actually make.</p>
        </div>
      </div>
    </main>

    <footer style="border-top:1px solid var(--rule);padding:20px clamp(20px,5vw,56px);
        display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <span style="font-size:12px;color:var(--faint);">Flaunt</span>
      <span style="font-size:12px;color:var(--faint);">Invitation-only</span>
    </footer>
  </div>`;
}

/* ---------- modal + router ---------- */
function modalHtml() {
  if (S.modal === 'camera') {
    return `<div class="scrim" onclick="if(event.target===this)closeCamera()">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Take a photo" style="max-width:420px;">
        <div style="display:flex;flex-direction:column;gap:7px;">
          <h2 class="serif" style="margin:0;font-size:24px;font-weight:400;letter-spacing:-.01em;">Take a photo</h2>
          <p style="margin:0;font-size:13px;color:var(--ink-soft);">Squared and resized here before anything is sent.</p>
        </div>
        <div style="width:100%;aspect-ratio:1;background:var(--sunk);border:1px solid var(--rule-2);overflow:hidden;
          border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <video id="cam-video" playsinline muted autoplay
            style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></video>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn" onclick="takePhoto()">Take photo</button>
          <button class="btn ghost" onclick="closeCamera()">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  if (S.modal !== 'invite') return '';
  const after = Math.max(0, (S.me ? S.me.tokenBalance : 1) - 1);
  return `<div class="scrim" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Send an invitation">
      <div style="display:flex;flex-direction:column;gap:7px;">
        <h2 class="serif" style="margin:0;font-size:26px;font-weight:400;letter-spacing:-.01em;">Send an invitation</h2>
        <p style="margin:0;font-size:13.5px;color:var(--ink-soft);">They will get one email from you. Not a reminder sequence.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;">
        <label class="lbl" for="inv-email">Their email</label>
        <input class="field mono" id="inv-email" type="email" placeholder="name@company.com" style="font-size:13.5px;">
      </div>
      <div style="border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span class="lbl">Your balance</span>
          <span style="font-size:12.5px;color:var(--ink-soft);">Deducted the moment you send</span>
        </div>
        <div style="display:flex;align-items:center;gap:13px;">
          <span class="mono" style="font-size:25px;color:var(--ghost);text-decoration:line-through;">${S.me ? S.me.tokenBalance : "—"}</span>
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.6"><path d="M4 12 H19 M14 7 L19 12 L14 17"/></svg>
          <span class="mono" style="font-size:25px;font-weight:500;">${after}</span>
        </div>
      </div>
      <div style="display:flex;gap:12px;background:var(--sunk);padding:15px 16px;">
        <span style="color:var(--good);display:flex;flex-shrink:0;">${RETURN}</span>
        <span style="font-size:13px;color:var(--ink-2);line-height:1.6;">If they decline, or do not respond within 7 days, your token comes back automatically.</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;">
        <button onclick="closeModal()" style="background:none;border:none;font-size:13.5px;color:var(--ink-soft);padding:13px 4px;">Cancel</button>
        <button class="btn" ${S.sending ? "disabled" : ""} onclick="sendInvite()"><span style="display:flex;">${COIN}</span>${S.sending ? "Sending…" : "Send invitation — 1 token"}</button>
      </div>
    </div></div>`;
}

function view() {
  if (APP === 'bms' && !signedIn()) return vBmsLogin();
  if (APP === 'portal' && !signedIn()) return vPortalAuth();
  if (APP === 'bms' && signedIn() && !S.stats && !S.dataError) return vBmsLoading();
  if (APP === 'bms' && S.dataError) {
    return bmsShell('users', `<div style="border:1px solid var(--bms-bad-line);background:var(--bms-bad-wash);
        padding:22px 24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;">
      <span style="font-size:14px;font-weight:600;color:var(--bms-bad);">Could not load admin data</span>
      <span style="font-size:12.5px;color:var(--bms-soft);">${esc(S.dataError)}</span>
      <button class="pill" onclick="S.dataError=null;S.stats=null;render();">Try again</button>
    </div>`);
  }
  if (APP === 'portal' && S.dataError) {
    return topbar('') + `<div class="wrap"><div class="col">${emptyState(
      'Could not load your account', S.dataError,
      `<button class="btn" onclick="S.dataError=null;S.me=null;render();">Try again</button>`)}</div></div>`;
  }
  if (APP === 'portal' && !S.me) return vPortalLoading();
  const h = location.hash || homeForApp();
  if (h === '#/signup') return vSignup();
  if (h === '#/welcome') return vWelcome();
  if (h === '#/invite') return vInviteResponse();
  if (h === '#/gatekeeper') return vGatekeeperInbox();
  if (h === '#/start') {
    // Reachable by back button, a stale link, or any future caller that has
    // not thought about it. Someone with a network is not a first run.
    if (S.connections && S.connections.length > 0) return vNetwork();
    return vFirstRun();
  }
  if (h === '#/profile') return vProfileEdit();
  if (h === '#/invitations') return vInvitations();
  if (h === '#/gatekeeper') return vGatekeeper();
  if (h === '#/tokens') return vTokens();
  if (h === '#/bms/users') return vBmsUsers();
  if (h === '#/bms/invitations') return vBmsInv();
  if (h === '#/bms/transactions') return vBmsTx();
  if (h === '#/bms/staff') return vBmsStaff();
  if (h === '#/bms/settings') return vBmsSettings();

  if (h.startsWith('#/p/')) return vProfile(h.slice(4));
  return APP === 'bms' ? vBmsUsers() : vNetwork();
}
function homeForApp() { return APP === 'bms' ? '#/bms/users' : '#/network'; }

/**
 * Where a member belongs after finishing something.
 *
 * The first-run screen is only ever right for somebody with no connections.
 * Declining an invitation used to route everyone there unconditionally, on the
 * assumption that anyone answering an invite link must be new — so an
 * established member who declined was shown a welcome screen offering them
 * their existing balance as tokens "to start with".
 */
function homeAfterAction() {
  return (S.connections && S.connections.length > 0) ? '#/network' : '#/start';
}

/**
 * Shown while the first load is in flight.
 *
 * It mirrors the shape of the page that is coming — a heading, a few rows —
 * rather than printing the word "Loading". A blank page with one grey word
 * reads as a broken site; a page whose skeleton matches what arrives reads as a
 * page that is nearly ready, and it stops the layout jumping when it lands.
 */
function vPortalLoading() {
  const row = `<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);">
    <div class="sk" style="width:30px;height:30px;border-radius:50%;flex:none;"></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
      <div class="sk" style="height:11px;width:32%;"></div>
      <div class="sk" style="height:9px;width:52%;"></div>
    </div>
    <div class="sk" style="height:9px;width:56px;flex:none;"></div>
  </div>`;
  return `<header class="top">
      <div style="display:flex;align-items:center;gap:clamp(20px,4vw,44px);min-width:0;">
        <span class="serif" style="font-size:23px;letter-spacing:.015em;">Flaunt</span>
        <div class="sk" style="height:11px;width:190px;"></div>
      </div>
      <div class="sk" style="height:24px;width:104px;"></div>
    </header>
    <div class="wrap"><div class="col" style="gap:20px;">
      <div class="sk" style="height:26px;width:230px;"></div>
      <div class="sk" style="height:12px;width:340px;"></div>
      <div style="margin-top:8px;">${row.repeat(6)}</div>
      <span class="sr-only" role="status" aria-live="polite">Loading your network</span>
    </div></div>`;
}

/**
 * The bar exists to warn, so it appears only when there is a warning.
 *
 * It used to say "Preview — payments run in Razorpay test mode" whenever
 * payMode was not 'live', which included every signed-out visitor: they never
 * load payment config, so the landing page of a launched product told everyone
 * it was a preview. Silence is the correct state now, and the bar returns only
 * for a signed-in member while billing is genuinely in test mode — where the
 * warning is true and worth making.
 */
function renderNotice() {
  const el = document.getElementById('notice');
  if (!el) return;
  const bms = APP === 'bms';
  const message = bms
    ? (S.payment && S.payment.mode === 'test'
        ? 'Billing is in test mode — no real cards are charged.' : '')
    : (S.me && S.payMode === 'test'
        ? 'Payments are in test mode — no real cards are charged.' : '');
  if (!message) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="background:${bms ? '#20262E' : '#2A2018'};color:${bms ? '#AEB8C4' : '#C9BCA8'};
      font-size:11.5px;letter-spacing:.02em;padding:7px 18px;text-align:center;">${message}</div>`;
}

function render() {
  renderNotice();
  /**
   * Second line of defence on identity. Whatever is in memory must belong to
   * the account the current token is for; if it does not, it is someone else's
   * and has to go before anything is painted. A stale-state bug should cost a
   * reload, never show one member another member's account.
   */
  const sess = session();
  if (sess && S.me && S.me.email && String(sess.email || '').toLowerCase() !== String(S.me.email).toLowerCase()) {
    console.warn('signed-in identity does not match loaded profile — discarding');
    reset();
  }

  // Nothing truthful can be rendered until the first load returns.
  if (APP === 'portal' && signedIn() && !S.me && !S.dataError && !S.loading) loadPortal();
  // The badge needs the count before the page is opened.
  if (APP === 'portal' && S.me && S.gatekeeper === null && !S.gkLoading && !S.gkError) loadGatekeeper();
  if (APP === 'bms' && signedIn() && !S.stats && !S.dataError && !S.loading) loadBms();

  // portal must not serve the admin console, and bms must not serve the user
  // app: they are different hostnames with different audiences.
  let h = location.hash || homeForApp();
  const isBms = h.indexOf('#/bms/') === 0;
  if ((APP === 'portal' && isBms) || (APP === 'bms' && !isBms)) { h = homeForApp(); location.hash = h; }
  /**
   * A throwing view used to freeze the app.
   *
   * render() assigns innerHTML from view(), so an exception inside any view
   * aborted before the assignment and left whatever was on screen — for a new
   * account, the loading skeleton, forever, with no error anywhere the user
   * could see. Failing loudly here costs one screen instead of the session.
   */
  let html;
  try {
    html = view();
  } catch (err) {
    console.error('view() failed', err);
    html = `<div class="wrap"><div class="col">${emptyState('Something went wrong on this screen',
      String((err && err.message) || err),
      `<button class="btn" onclick="location.hash=homeForApp();render();">Back to safety</button>`)}</div></div>`;
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('layer').innerHTML = modalHtml() + versionTip()
    + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : '');

  // render() rebuilds the layer, so a live camera loses the element its stream
  // was attached to. Reattach rather than reopening the device.
  if (S.cameraStream) {
    const v = document.getElementById('cam-video');
    if (v && !v.srcObject) { v.srcObject = S.cameraStream; v.play().catch(() => {}); }
  }

  // Focus the one field the user is obviously here to fill. render() replaces
  // the DOM wholesale, so the HTML autofocus attribute never fires on a
  // re-render — the focus has to be reapplied each time. Guarded so it does not
  // steal the caret back while they are mid-type.
  const code = document.getElementById('auth-code');
  if (code && document.activeElement !== code) code.focus();

  // The filter re-renders on every keystroke, which destroys the input it was
  // typed into. Restore focus and caret so typing is not interrupted.
  const nf = document.getElementById('net-filter');
  if (nf && S.netFilter && document.activeElement !== nf) {
    nf.focus();
    nf.setSelectionRange(nf.value.length, nf.value.length);
  }
}
/**
 * The click must not reach the outside-click listener.
 *
 * render() replaces the DOM, so by the time this click bubbles to window the
 * event target is a detached node — the wrapper cannot contain it, the listener
 * reads that as a click outside, and the menu shuts in the same gesture that
 * opened it. From the outside it looked like the avatar did nothing at all.
 */
function toggleUserMenu(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  S.userMenu = !S.userMenu;
  render();
}

addEventListener('click', function (e) {
  if (!S.userMenu) return;
  const wrap = document.getElementById('user-menu');
  if (wrap && !wrap.contains(e.target)) { S.userMenu = false; render(); }
});
addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.userMenu) { S.userMenu = false; render(); }
  if (e.key === 'Escape' && S.modal === 'camera') closeCamera();
});

addEventListener('hashchange', render);
watchForNewVersion();
if (!location.hash) location.hash = homeForApp();
render();
</script>
