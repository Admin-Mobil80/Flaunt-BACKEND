# Flaunt API. Two Cognito pools authorize against this one endpoint: members
# (flaunt.network) and staff (bms.flaunt.network).
#
# With more than one authorization mode configured, AppSync reaches a field
# carrying no directive using the DEFAULT mode only — here, the member pool. A
# staff token is then rejected before any resolver runs. So every field and type
# a staff token must reach is annotated @aws_cognito_user_pools, which admits
# any configured Cognito pool.
#
# That deliberately lets a MEMBER token through the door on admin fields too:
# the directive cannot tell two Cognito pools apart. Authorization is therefore
# not the schema's job — the admin resolver re-checks the issuing pool and the
# caller's email against verified claims. Being authenticated is not being an
# admin.

# One person who could make an introduction. There is often more than one.
type IntroPath {
  userId: ID!
  name: String!
  designation: String
  photoAt: String
}

type Profile {
  userId: ID!
  name: String!
  designation: String
  organisation: String
  location: String
  bio: String
  country: String!
  # Masked to riy**@mo******.com for 2nd degree, absent beyond it (§3.2).
  primaryEmail: String
  secondaryEmail: String
  connectedAt: String
  # 1 = direct, 2 = through a mutual connection, null = not visible.
  degree: Int
  # The first available introducer, kept for lists that show only one.
  viaName: String
  viaUserId: ID
  # EVERY mutual connection who could introduce you. A second-degree contact is
  # often reachable through several of your own, and which one you ask matters.
  viaOptions: [IntroPath!]!
  # True when a second address is on file but not yet proved.
  secondaryEmailUnverified: Boolean
  # When the photo was last replaced. Absent means no photo; the value doubles
  # as the cache-busting version, since the object key itself never changes.
  photoAt: String
}

type Me {
  userId: ID!
  name: String!
  email: String!
  designation: String
  organisation: String
  location: String
  bio: String
  country: String!
  tokenBalance: Int!
  createdAt: String!
  connectionCount: Int!
  # Optional second address. Stored as an unverified claim until a
  # verification round-trip exists.
  secondaryEmail: String
  photoAt: String
}

type Connection {
  userId: ID!
  name: String!
  designation: String
  organisation: String
  location: String
  connectedAt: String!
  # How many direct connections they have. Their reach, not yours.
  connectionCount: Int!
  photoAt: String
  # Shown truncated in lists — enough to tell two people with the same job apart.
  bio: String
}

type Invitation @aws_cognito_user_pools {
  inviteId: ID!
  senderName: String
  senderDesignation: String
  recipientEmail: String!
  status: String!
  type: String!
  createdAt: String!
  expiresAt: Int
  daysLeft: Int
  tokenOutcome: String!
  # Set on introduction requests: who you asked to meet, and through whom.
  targetName: String
  gatekeeperName: String
  # SENT by the caller, or RECEIVED by them.
  direction: String
  senderUserId: ID
  senderPhotoAt: String
}

# Amounts are minor units — paise or cents — because that is what Razorpay
# takes and what avoids float drift.
type BundlePrice {
  currency: String!
  symbol: String!
  tokens: Int!
  baseMinor: Int!
  taxMinor: Int!
  totalMinor: Int!
  taxLabel: String
  baseDisplay: String!
  taxDisplay: String
  totalDisplay: String!
}

type SecondDegreePage {
  items: [Profile!]!
  total: Int!
  hasMore: Boolean!
}

type IntroductionRequest {
  inviteId: ID!
  status: String!
  createdAt: String!
  daysLeft: Int
  # Who asked.
  requesterName: String!
  requesterDesignation: String
  requesterUserId: ID!
  requesterPhotoAt: String
  # Who they want to meet.
  targetName: String!
  targetDesignation: String
  targetUserId: ID!
}

type PhotoUpload {
  size: String!
  pixels: Int!
  url: String!
}

type PhotoUploadTicket {
  uploads: [PhotoUpload!]!
}

type PaymentOrder {
  orderId: ID!
  # The publishable key Razorpay Checkout is opened with. Never the secret.
  keyId: String!
  amountMinor: Int!
  currency: String!
  tokens: Int!
  mode: String!
}

type AdminUser @aws_cognito_user_pools {
  userId: ID!
  name: String!
  email: String!
  country: String!
  tokenBalance: Int!
  connectionCount: Int!
  createdAt: String!
}

type PricingConfig @aws_cognito_user_pools {
  tokensPerBundle: Int!
  allowedSizes: [Int!]!
  signupTokens: Int!
  signupRange: [Int!]!
  updatedAt: String
  updatedBy: String
}

type PaymentConfig @aws_cognito_user_pools {
  mode: String!
  modes: [String!]!
  secretName: String!
  live: Boolean!
  updatedAt: String
  updatedBy: String
}

type AdminPayment @aws_cognito_user_pools {
  orderId: ID!
  # Razorpay's payment id, present only once a payment actually succeeded.
  paymentId: String
  userId: ID!
  memberName: String
  memberEmail: String
  # CREATED means an order we made that was never paid — an abandoned checkout,
  # or a payment whose webhook never reached us.
  status: String!
  mode: String!
  tokens: Int!
  currency: String!
  totalMinor: Int!
  createdAt: String!
  paidAt: String
}

type CurrencyTotal @aws_cognito_user_pools {
  currency: String!
  minor: Int!
}

type AdminPaymentPage @aws_cognito_user_pools {
  items: [AdminPayment!]!
  total: Int!
  paidCount: Int!
  hasMore: Boolean!
  # Collected per currency, across every payment rather than the page shown.
  gross: [CurrencyTotal!]!
}

type AdminUserPage @aws_cognito_user_pools {
  items: [AdminUser!]!
  # After any search filter, so the pager describes what is on screen.
  total: Int!
  hasMore: Boolean!
}

type AdminStaff @aws_cognito_user_pools {
  email: String!
  name: String
  # OWNER is set by deployment and cannot be removed from the console.
  role: String!
  status: String!
  addedBy: String
  createdAt: String
}

type AdminStats @aws_cognito_user_pools {
  totalUsers: Int!
  usersIndia: Int!
  usersInternational: Int!
  # Sitting in members' balances, unspent.
  tokensOutstanding: Int!
  # Spent on an invitation or introduction and never returned.
  tokensConsumed: Int!
  # Spent, then handed back because the invitation died without connecting anyone.
  tokensRefunded: Int!
}

type Query {
  me: Me!
  myConnections: [Connection!]!
  # People one step beyond your direct contacts, and who could introduce you.
  # Paginated: a well-connected member's second degree runs to thousands.
  # q searches name, designation and organisation across the WHOLE second
  # degree, not just the page already loaded.
  secondDegree(limit: Int, offset: Int, q: String): SecondDegreePage!
  # Introduction requests waiting on the caller's approval, as the gatekeeper.
  gatekeeperRequests: [IntroductionRequest!]!
  myInvitations: [Invitation!]!
  # Invitations addressed to the caller, waiting on them.
  incomingInvitations: [Invitation!]!
  tokenPrice: BundlePrice!
  # "test" or "live" — the app says which, rather than implying real money moves.
  paymentMode: String!
  # The invitation named by a link, returned only to the address it was sent to.
  invitation(inviteId: ID!): Invitation
  profile(userId: ID!): Profile
  # A direct contact's own connections — who you could ask them to introduce
  # you to. Only available for someone you are directly connected to.
  connectionsOf(userId: ID!): [Profile!]!
  searchPeople(query: String!): [Profile!]!

  # q matches name or email, case-insensitively, across every account.
  adminUsers(limit: Int, offset: Int, q: String): AdminUserPage! @aws_cognito_user_pools
  adminStats: AdminStats! @aws_cognito_user_pools
  adminInvitations(status: String): [Invitation!]! @aws_cognito_user_pools
  # mode is "test", "live", or "all".
  adminPayments(limit: Int, offset: Int, mode: String): AdminPaymentPage! @aws_cognito_user_pools
  adminStaff: [AdminStaff!]! @aws_cognito_user_pools
  # The caller's own access, so the console can hide what they cannot do.
  adminWhoAmI: AdminStaff! @aws_cognito_user_pools
  adminPricingConfig: PricingConfig! @aws_cognito_user_pools
  adminPaymentConfig: PaymentConfig! @aws_cognito_user_pools
}

type Mutation {
  # Debits one token and creates the invitation in a single transaction, so a
  # token can never be spent without the invite that justifies it.
  sendInvitation(email: String!): Invitation!
  # Profile writes go through the API rather than Cognito attributes, so the bio
  # is bounded by DynamoDB rather than Cognito's 2048-character ceiling.
  # Accepting spends the token for good and creates the connection both ways.
  acceptInvitation(inviteId: ID!): Invitation!
  # Declining returns the sender's token and tells them.
  declineInvitation(inviteId: ID!): Invitation!
  # Withdrawn by the sender while still pending. Returns their token.
  cancelInvitation(inviteId: ID!): Invitation!
  # Removes the connection for BOTH people. There is no one-sided version.
  removeConnection(userId: ID!): Boolean!
  # Asks a mutual connection to introduce you to someone at second degree.
  # Costs a token immediately, refunded if the gatekeeper declines, the target
  # declines, or nobody responds within seven days.
  requestIntroduction(targetUserId: ID!, viaUserId: ID!): Invitation!
  # Gatekeeper decisions. Approving forwards the request to the target.
  # The note is the introducer vouching in their own words — it is what turns a
  # forwarded request into a real introduction.
  approveIntroduction(inviteId: ID!, note: String): Invitation!
  declineIntroduction(inviteId: ID!): Invitation!
  # Creates a Razorpay order for one token bundle, priced from the caller's own
  # country. Tokens are credited by the webhook, never by the browser.
  createPaymentOrder: PaymentOrder!
  # Presigned PUTs for the caller's own photo keys, one per stored size.
  createPhotoUpload: PhotoUploadTicket!
  # Records the photo after checking both objects actually landed.
  confirmPhotoUpload: Me!
  removeProfilePhoto: Me!
  updateProfile(
    name: String
    designation: String
    organisation: String
    location: String
    bio: String
    secondaryEmail: String
  ): Me!
  # How many tokens a bundle contains. The amount charged does not change —
  # only what it buys. Restricted to 25, 50, 75 or 100.
  # Owner only. Creates their sign-in account and grants console access.
  adminAddStaff(email: String!, name: String): AdminStaff! @aws_cognito_user_pools
  adminRemoveStaff(email: String!): Boolean! @aws_cognito_user_pools
  adminSetTokensPerBundle(tokens: Int!): PricingConfig! @aws_cognito_user_pools
  # How many tokens a new account is granted. 1–10.
  adminSetSignupTokens(tokens: Int!): PricingConfig! @aws_cognito_user_pools
  # Switches which Razorpay environment the billing integration uses. "live"
  # means real cards are charged.
  adminSetPaymentMode(mode: String!): PaymentConfig! @aws_cognito_user_pools
}

schema {
  query: Query
  mutation: Mutation
}
