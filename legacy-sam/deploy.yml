name: Deploy Backend

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # TODO: replace with the flaunt-backend-deploy-role ARN output by bootstrap/github-oidc.yaml
  DEPLOY_ROLE_ARN: arn:aws:iam::<AWS_ACCOUNT_ID>:role/flaunt-backend-deploy-role
  # TODO: replace with the Route 53 Hosted Zone ID for flaunt.network
  HOSTED_ZONE_ID: <ROUTE53_HOSTED_ZONE_ID>

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build
        run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides HostedZoneId="$HOSTED_ZONE_ID"
